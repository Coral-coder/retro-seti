<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Retro SETI</title>
<meta name="description" content="A tribute to the classic 1999-era SETI@home screensaver. Simulated radio telescope data analysis that keeps your display awake.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Crect x='3' y='20' width='4' height='9' fill='%2300a0ff'/%3E%3Crect x='9' y='14' width='4' height='15' fill='%2300dc5a'/%3E%3Crect x='15' y='6' width='4' height='23' fill='%23ff2020'/%3E%3Crect x='21' y='12' width='4' height='17' fill='%23f0f000'/%3E%3Crect x='27' y='22' width='3' height='7' fill='%231428c8'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; }
  body.idle { cursor: none; }
  #ui {
    position: fixed; right: 12px; bottom: 12px; display: flex; gap: 8px;
    font: 13px/1 Verdana, Tahoma, Arial, sans-serif; transition: opacity .6s;
  }
  body.idle #ui { opacity: 0; pointer-events: none; }
  body.scr { cursor: none; }
  body.scr #ui { display: none; }
  #ui button, #ui a {
    background: #000a28; color: #c8d6ff; border: 1px solid #3d5aa0; padding: 7px 10px;
    border-radius: 3px; cursor: pointer; text-decoration: none; font: inherit;
  }
  #ui button:hover, #ui a:hover { background: #0a1a50; color: #fff; }
  #settings {
    background: #000; color: #fff; border: 5px solid #9a66f6; border-radius: 22px; padding: 22px 26px 18px;
    font: 15px/1.4 Arial, "Liberation Sans", Helvetica, sans-serif; width: min(460px, calc(100vw - 32px)); box-sizing: border-box;
  }
  #settings::backdrop { background: rgba(0, 0, 0, 0.55); }
  #settings h2 { margin: 0 0 14px; font-size: 20px; font-weight: normal; text-align: center; }
  #settings .row { display: grid; grid-template-columns: 1fr 64px; gap: 2px 12px; align-items: center; margin: 0 0 12px; }
  #settings label { grid-column: 1 / 3; color: #c8d6ff; }
  #settings input[type=range] { width: 100%; accent-color: #9a66f6; }
  #settings output { text-align: right; font-variant-numeric: tabular-nums; }
  #settings .hint { color: #8a8a8a; font-size: 13px; margin: 0 0 14px; }
  #settings .buttons { display: flex; gap: 8px; justify-content: flex-end; }
  #settings button { background: #000a28; color: #c8d6ff; border: 1px solid #3d5aa0; padding: 7px 12px; border-radius: 3px; cursor: pointer; font: inherit; }
  #settings button:hover { background: #0a1a50; color: #fff; }
  #settings button.primary { border-color: #9a66f6; }
</style>
</head>
<body>
<canvas id="c" aria-label="Simulated radio telescope data analysis"></canvas>
<div id="ui">
  <button id="wakeBtn" type="button" title="Keep the display from sleeping">Display awake: …</button>
  <button id="settingsBtn" type="button" title="Animation speeds (S)">Settings</button>
  <button id="nameBtn" type="button" title="Set your user name (N)">Set name</button>
  <button id="logoBtn" type="button" title="Use your own logo in the title (L)">Upload logo</button>
  <button id="logoClear" type="button" title="Go back to the classic title" hidden>Remove logo</button>
  <input id="logoFile" type="file" accept="image/*" hidden>
  <a href="hline.html" title="Map the Milky Way with a backyard dish">Hydrogen line</a>
  <a id="dlBtn" href="download/RetroSETI.scr" download title="Windows screensaver">Windows screensaver</a>
  <button id="fsBtn" type="button" title="Fullscreen (F or double-click)">Fullscreen</button>
</div>
<dialog id="settings" aria-labelledby="settingsTitle">
  <form method="dialog">
    <h2 id="settingsTitle">Settings</h2>
    <div id="settingsRows"></div>
    <p class="hint">Changes apply immediately and are saved in this browser.</p>
    <div class="buttons">
      <button type="button" id="settingsReset">Reset to defaults</button>
      <button type="submit" class="primary">Done</button>
    </div>
  </form>
</dialog>
<script src="seti.js"></script>
<script src="hmodel.js"></script>
<script src="displays/dsn.js"></script>
<script src="displays/hline.js"></script>
<script src="displays/pulsar.js"></script>
<script src="displays/blackhole.js"></script>
<script src="displays/skyscan.js"></script>
</body>
</html>
